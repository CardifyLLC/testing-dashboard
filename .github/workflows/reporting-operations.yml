name: Reporting and operations
on:
  workflow_dispatch:
    inputs:
      kind:
        description: Job to run (scheduled catches due UTC daily and weekly reports)
        type: choice
        options: [health, scheduled, daily, weekly, ideas]
        default: health
  schedule:
    - cron: '11,26,41,56 * * * *'
permissions:
  contents: read
concurrency:
  group: reporting-operations
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DASHBOARD_APP_URL: ${{ vars.DASHBOARD_APP_URL }}
      REPORTING_JOB_SECRET: ${{ secrets.REPORTING_JOB_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run reporting job
        env:
          JOB_KIND: ${{ inputs.kind || 'scheduled' }}
        run: node scripts/reporting-job.mjs "$JOB_KIND"
      - name: Monitor operations
        if: always() && github.event_name == 'schedule'
        run: node scripts/reporting-job.mjs health
      - name: Generate weekly proposals
        if: github.event_name == 'schedule' && vars.GROWTH_IDEAS_ENABLED == 'true'
        run: node scripts/reporting-job.mjs ideas
      - name: Independent fallback alert
        if: failure()
        env:
          ALERT_URL: ${{ secrets.OPERATIONS_ALERT_WEBHOOK_URL }}
        run: node scripts/operations-fallback-alert.mjs
