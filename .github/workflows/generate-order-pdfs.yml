name: Generate Order PDFs

on:
  workflow_dispatch:
    inputs:
      max_orders:
        description: Maximum orders to process in this run
        required: false
        default: '3'
  repository_dispatch:
    types: [order_pdf_requested, order_pdf_continue]
  schedule:
    - cron: '3-58/5 * * * *'

concurrency:
  group: order-pdf-worker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MAX_ORDERS: ${{ inputs.max_orders || '3' }}
      MAX_ATTEMPTS: '5'
      GITHUB_WORKFLOW_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY_NAME: ${{ github.repository }}
      CUSTOMER_APP_URL: ${{ vars.CUSTOMER_APP_URL || 'https://tcgplaytest.com' }}
      ORDER_PDF_WEBHOOK_SECRET: ${{ secrets.ORDER_PDF_WEBHOOK_SECRET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate queued order PDFs
        run: npm run worker:order-pdfs
